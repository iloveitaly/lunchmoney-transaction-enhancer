[project]
name = "lunchmoney-transaction-enhancer"
version = "0.2.0"
description = "Enrich Lunch Money transactions using regex extraction rules"
keywords = ["lunchmoney", "personal-finance", "plaid", "automation"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "lunchable>=1.4.3",
    "requests>=2.32.5",
    "structlog>=26.1.0",
    "structlog-config>=0.10.0",
    "tenacity>=9.1.4",
    "whenever>=0.10.4",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/lunchmoney-transaction-enhancer" }


# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
lunchmoney-transaction-enhancer = "lunchmoney_transaction_enhancer:main"


[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.3",
    "coverage>=7.15.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["lunchmoney_transaction_enhancer"]

[tool.coverage.report]
fail_under = 50
